[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "llmquant"
version = "0.1.0"
description = "Quantize LLMs to GGUF with llama.cpp and register them in Ollama (GUI)"
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.12",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
llmquant = "llmquant.cli:main"

[project.gui-scripts]
llmquant-gui = "llmquant.cli:main"

[tool.setuptools]
packages = ["llmquant"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
